name: News Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Üst üste binen çalıştırmaları engeller; news_seen.json çakışmasını önler.
concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_alert.py

      # Bot hata verse veya zaman aşımına uğrasa bile gönderilen haberlerin
      # kaydı repoya işlensin (if: always()).
      - name: Haber geçmişini kaydet
        if: always()
        run: |
          if [ -n "$(git status --porcelain news_seen.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add news_seen.json
            git commit -m "chore: update news_seen.json"
            git pull --rebase
            git push
          fi
